<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
  <title id="title">VecTrace HTML report screenshot</title>
  <desc id="desc">Stylized screenshot of a VecTrace report with Vector, Chunk, and Source Document cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef7f3"/>
      <stop offset="100%" stop-color="#f4f6f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="880" fill="url(#bg)"/>

  <rect x="48" y="36" width="1304" height="120" rx="22" fill="#0f766e" filter="url(#shadow)"/>
  <text x="92" y="92" fill="#ffffff" font-size="44" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="700">VecTrace Trace Report</text>
  <text x="92" y="132" fill="#d6f3ee" font-size="24" font-family="Avenir Next, Segoe UI, Arial, sans-serif">Vector vec_demo_001 traced to document source in seconds</text>

  <rect x="48" y="184" width="1304" height="192" rx="18" fill="#ffffff" stroke="#d8e3ea" filter="url(#shadow)"/>
  <text x="80" y="238" fill="#0f172a" font-size="42" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="700">Vector</text>
  <text x="80" y="286" fill="#52606d" font-size="30" font-family="Avenir Next, Segoe UI, Arial, sans-serif">ID</text>
  <rect x="330" y="252" width="240" height="46" rx="10" fill="#f7fafc" stroke="#e4ebf1"/>
  <text x="350" y="283" fill="#1f2937" font-size="34" font-family="Menlo, Consolas, Monaco, monospace">vec_demo_001</text>
  <text x="80" y="344" fill="#52606d" font-size="30" font-family="Avenir Next, Segoe UI, Arial, sans-serif">Model</text>
  <rect x="330" y="312" width="370" height="46" rx="23" fill="#d9f3ef" stroke="#bce7df"/>
  <text x="352" y="343" fill="#115e59" font-size="31" font-family="Menlo, Consolas, Monaco, monospace">text-embedding-3-small</text>

  <rect x="48" y="402" width="1304" height="212" rx="18" fill="#ffffff" stroke="#d8e3ea" filter="url(#shadow)"/>
  <text x="80" y="455" fill="#0f172a" font-size="42" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="700">Chunk</text>
  <text x="80" y="503" fill="#52606d" font-size="30" font-family="Avenir Next, Segoe UI, Arial, sans-serif">Strategy</text>
  <rect x="330" y="472" width="170" height="46" rx="23" fill="#d9f3ef" stroke="#bce7df"/>
  <text x="366" y="503" fill="#115e59" font-size="31" font-family="Menlo, Consolas, Monaco, monospace">semantic</text>
  <rect x="80" y="536" width="1240" height="58" rx="10" fill="#f9fbfc" stroke="#e8edf2"/>
  <text x="102" y="574" fill="#1f2937" font-size="33" font-family="Menlo, Consolas, Monaco, monospace">Customers can request a refund within 30 days if the item is defective.</text>

  <rect x="48" y="640" width="1304" height="192" rx="18" fill="#ffffff" stroke="#d8e3ea" filter="url(#shadow)"/>
  <text x="80" y="694" fill="#0f172a" font-size="42" font-family="Avenir Next, Segoe UI, Arial, sans-serif" font-weight="700">Source Document</text>
  <text x="80" y="742" fill="#52606d" font-size="30" font-family="Avenir Next, Segoe UI, Arial, sans-serif">Path</text>
  <rect x="330" y="708" width="700" height="46" rx="10" fill="#f7fafc" stroke="#e4ebf1"/>
  <text x="352" y="739" fill="#1f2937" font-size="33" font-family="Menlo, Consolas, Monaco, monospace">s3://demo/customer_refunds_policy.pdf</text>
  <text x="80" y="801" fill="#52606d" font-size="26" font-family="Avenir Next, Segoe UI, Arial, sans-serif">Generated by VecTrace</text>
</svg>
