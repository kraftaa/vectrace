[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectrace"
version = "0.1.4"
description = "Vector lineage tracking for RAG pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VecTrace Maintainers" }]
keywords = ["rag", "llm", "observability", "cli", "vector-database", "qdrant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.8.0"]

[project.scripts]
vectrace = "vectrace:cli"

[tool.setuptools]
py-modules = ["vectrace"]
packages = ["lineage", "connectors", "output"]

[tool.setuptools.package-data]
lineage = ["schema.sql"]
